# GTK/GNOME settings loaded by desktop/bootstrap.sh with `dconf load /`.
# Regenerate: dconf dump /org/gnome/desktop/ (then trim to these sections).

[org/gnome/desktop/interface]
color-scheme='prefer-dark'
cursor-blink=true
cursor-blink-time=1000
cursor-size=24
cursor-theme='breeze_cursors'
document-font-name='Noto Sans  10'
enable-animations=true
font-antialiasing='grayscale'
font-hinting='slight'
font-name='Noto Sans  10'
font-rgba-order='rgb'
gtk-theme='Adwaita'
icon-theme='Slot-Nord-Dark-Icons'
monospace-font-name='Hack  10'
scaling-factor=uint32 1
text-scaling-factor=1.0
toolbar-icons-size='large'
toolbar-style='text'
toolkit-accessibility=true

[org/gnome/desktop/sound]
event-sounds=true
input-feedback-sounds=false
theme-name='ocean'

[org/gnome/desktop/wm/preferences]
button-layout='icon:minimize,maximize,close'
