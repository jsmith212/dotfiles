- defaults:
    link:
      relink: true
      create: true

- clean: ["~"]

- create:
    - ~/bin
    - ~/.asdf

- link:
    # Shells
    ~/.profile:
    ~/.bashrc:
    ~/.zshrc: zsh/zshrc
    ~/.zshrc.local: local/zshrc.local
    ~/.oh-my-zsh: zsh/ohmyzsh
    ~/.oh-my-zsh/custom/themes/powerlevel10k: zsh/powerlevel10k
    ~/.p10k.zsh: zsh/p10k.zsh

    # Alacritty
    ~/.config/alacritty: alacritty

    # Hyprland + desktop environment
    ~/.config/hypr: desktop/hypr
    ~/.config/hyprdynamicmonitors: desktop/hyprdynamicmonitors
    ~/.config/waybar: desktop/waybar
    ~/.config/rofi: desktop/rofi
    ~/.config/swaync: desktop/swaync
    ~/.config/matugen: desktop/matugen
    ~/Wallpapers: desktop/wallpapers

    # GTK / Qt theming
    ~/.config/gtk-3.0: desktop/gtk-3.0
    ~/.config/gtk-4.0: desktop/gtk-4.0
    ~/.config/qt5ct: desktop/qt5ct
    ~/.config/qt6ct: desktop/qt6ct
    ~/.config/xsettingsd: desktop/xsettingsd
    ~/.config/nwg-look: desktop/nwg-look
    ~/.config/gtkrc: desktop/gtkrc
    ~/.config/gtkrc-2.0: desktop/gtkrc-2.0-config
    ~/.gtkrc-2.0: desktop/gtkrc-2.0-home
    ~/.config/mimeapps.list: desktop/mimeapps.list

    # Icon + cursor themes
    ~/.local/share/icons/default: desktop/icons/default
    ~/.local/share/icons/rose-pine: desktop/icons/rose-pine
    ~/.local/share/icons/Slot-Nord-Dark-Icons: desktop/icons/Slot-Nord-Dark-Icons

    # Desktop extras
    ~/.config/btop: desktop/btop
    ~/.config/fastfetch: desktop/fastfetch

    # ZSH Plugins
    ~/.oh-my-zsh/custom/plugins/zsh-autosuggestions: zsh/zsh-autosuggestions
    ~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting: zsh/zsh-syntax-highlighting

    # Completions
    ~/.zsh/completions/just.zsh: just/just.zsh

    # Tmux
    ~/.tmux:
    ~/.tmux.conf:

    # Vim
    ~/.config/nvim: nvim

    # Tools
    ~/.config/k9s: k9s
    ~/.config/goose/config.yaml: goose/config.yaml

    # Claude
    ~/.claude/agents: claude/agents

- shell:
    - command: git submodule sync --recursive
      description: Sync Submodules
      quiet: true
    - command: git submodule update --init --recursive
      description: Update Submodules
      quiet: true
    - command: ./asdf/install-asdf.sh
      description: Install ASDF
      quiet: false
    - command: ./desktop/bootstrap.sh
      description: Seed generated Hyprland colours + monitors
      quiet: false

- asdf:
    - plugin: cue
      url: https://github.com/asdf-community/asdf-cue.git
      default: 0.14.0
      versions:
        - 0.14.0
    - plugin: kubectl
      url: https://github.com/asdf-community/asdf-kubectl.git
      default: latest
      versions:
        - latest
    - plugin: nodejs
      url: https://github.com/asdf-vm/asdf-nodejs
      default: latest
      versions:
        - 18.17.0
        - latest
    - plugin: golang
